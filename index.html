<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counter Fixed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .watch-face {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        #count {
            /* FIXED: Use vh (viewport height) so it never overflows */
            font-size: 35vh; 
            font-weight: 500;
            margin: 0;
            /* Tighten the invisible box around the text */
            line-height: 0.8; 
            margin-bottom: 5vh;
            z-index: 1; /* Sit behind buttons */
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 2vh; 
            width: 80%;
            z-index: 10; /* Ensure buttons are always clickable */
        }

        button {
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Helper for z-index */
        }

        .btn-plus { 
            background-color: #30d158; 
            color: black; 
            height: 25vh; /* Fixed height relative to screen */
            font-size: 10vh; 
        }

        .btn-reset { 
            background-color: #222; 
            color: #ff453a; 
            height: 12vh;
            font-size: 4vh;
        }
        
        button:active { opacity: 0.7; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="watch-face">
        <div id="count">0</div>

        <div class="controls">
            <button class="btn-plus" onclick="increment()">+</button>
            <button class="btn-reset" onclick="reset()">RESET</button>
        </div>
    </div>

    <script>
        let count = 0;
        const display = document.getElementById('count');

        function vibrate(ms) {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(ms); } catch(e){}
            }
        }

        function checkSize() {
            // Shrink slightly if we hit 3 digits (100+)
            if (count >= 100) {
                display.style.fontSize = "25vh";
            } else {
                display.style.fontSize = "35vh";
            }
        }

        function increment() {
            count++;
            display.innerText = count;
            checkSize();
            vibrate(20); 
        }

        function reset() {
            count = 0;
            display.innerText = count;
            checkSize();
            vibrate(50);
        }
    </script>
</body>
</html>
