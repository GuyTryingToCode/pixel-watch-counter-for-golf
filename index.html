<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haptic Watch Counter XL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .watch-face {
            width: 100vw;
            height: 100vh; /* Use full height */
            max-width: 384px;
            max-height: 384px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center everything tightly */
            align-items: center;
            padding: 0; /* Removed padding to maximize space */
            box-sizing: border-box;
        }

        #count {
            /* Increased from 6rem to 9rem (50% larger) */
            font-size: 9rem; 
            font-weight: 500;
            margin: 0;
            line-height: 1;
            transition: transform 0.1s ease;
            margin-bottom: 10px; /* Slight space before buttons */
        }

        /* Dynamic font resizing class for 3 digits */
        .count-small {
            font-size: 6.5rem !important;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Reduced gap to fit larger buttons */
            width: 85%; /* Slightly wider for easier tapping */
        }

        button {
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-plus { 
            background-color: #30d158; 
            color: black; 
            /* Increased padding (14px -> 22px) and font (1.1rem -> 1.7rem) */
            padding: 22px 0; 
            font-size: 1.7rem; 
        }

        .btn-reset { 
            background-color: #222; 
            color: #ff453a; 
            /* Increased padding (10px -> 15px) and font (0.8rem -> 1.1rem) */
            padding: 15px 0; 
            font-size: 1.1rem; 
        }
        
        button:active { opacity: 0.7; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="watch-face">
        <div id="count">0</div>

        <div class="controls">
            <button class="btn-plus" onclick="increment()">+</button>
